version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SECRET_KEY=change-me-dev-only-not-for-production
      - CHROMADB_PATH=/app/data/chromadb
      - BNCC_DATA_PATH=/app/data/bncc_v1.json
      - DATABASE_URL=sqlite+aiosqlite:////app/data/platform.db
      - EMAIL_BACKEND=console
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./scripts:/app/scripts
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Sem servidor ChromaDB: a app usa o PersistentClient embarcado
  # (app/services/vector_store.py). O servidor HTTP do Chroma 1.0–1.5.9 tem RCE
  # pré-auth sem patch (CVE-2026-45829) e não deve rodar exposto na rede.

  # Redis for caching (future enhancement) — só no loopback: não tem senha.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
