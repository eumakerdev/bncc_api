# Build + push da imagem da BNCC API para o Artifact Registry.
# O deploy no Cloud Run e as migrações Alembic ficam no script deploy/cloudrun.*
# (dependem de recursos com estado: Cloud SQL, secrets).
#
# Uso:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=southamerica-east1,_TAG=v1
#
# O build gera os embeddings (ChromaDB) dentro da imagem — passo pesado de ML —,
# por isso o timeout folgado.

substitutions:
  _REGION: southamerica-east1
  _REPO: bncc
  _IMAGE: api
  _TAG: latest

options:
  # Sem `machineType`: o default (E2_MEDIUM) é o único elegível aos 120 minutos
  # de build gratuitos por dia. Pedir E2_HIGHCPU_8 renunciava a esse free tier e
  # fazia todo build ser cobrado, para acelerar um passo que roda poucas vezes por
  # mês. A imagem também deixou de instalar o torch com CUDA (~2,5 GB) e a stack
  # de PDF/dev, então o build encolheu bastante — ver Dockerfile.
  logging: CLOUD_LOGGING_ONLY

# Folga generosa: os builds levavam 9-18 min em 8 vCPU, e a máquina padrão tem 2 —
# os trechos limitados por CPU (geração de embeddings, compilação de wheels) ficam
# proporcionalmente mais lentos. A imagem também encolheu bastante (torch CPU-only,
# sem stack de dev), o que empurra na direção oposta. 80 min cobrem os dois efeitos
# com margem; o objetivo do teto é falhar alto num build travado, não apertar o
# caminho normal.
timeout: 4800s

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}"
      - "."
